name: Build and tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Ein PR, der nur Markdown oder Dateien unter docs/ aendert, braucht keinen Kernelbuild. Als Bedingung am Job
      # statt als Pfadfilter am Workflow, damit uebersprungene Jobs spaeter als Pflichtpruefung nicht haengen bleiben.
      - name: Check whether anything but documentation changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            # Laesst sich die Dateiliste nicht lesen, wird gebaut: lieber ein Build zu viel als einer zu wenig.
            # Bei Umbenennungen zaehlt auch der alte Pfad: Code, der nach docs/ wandert, ist kein Doku-PR.
            if files=$(gh api "$FILES_URL" --paginate --jq '.[] | .filename, (.previous_filename // empty)') \
              && [ -n "$files" ] && ! grep -qvE '(\.md$|^docs/)' <<<"$files"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Kernelbuild noetig: $code"

  tests:
    name: Shell tests and .NET analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore test dependencies
        run: dotnet restore ProjektZeh.Tests/ProjektZeh.Tests.csproj

      - name: Build and check .NET diagnostics
        run: dotnet build ProjektZeh.Tests/ProjektZeh.Tests.csproj --configuration Release --no-restore -warnaserror

      # Ein haengender Test bricht nach drei Minuten ab und wird namentlich genannt, statt den Job bis zum Zeitlimit zu blockieren.
      - name: Run shell tests
        run: >-
          dotnet test ProjektZeh.Tests/ProjektZeh.Tests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=shell-tests.trx"
          --collect "Code Coverage;Format=cobertura"
          --blame-hang-timeout 3m --blame-hang-dump-type none
          --results-directory TestResults

      # Vor der Abdeckungspruefung, damit ein Fehler in check-coverage.py selbst sichtbar wird.
      - name: Run Python script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check coverage
        # Alle gefundenen Berichte werden zusammengefuehrt (die Hang-Erkennung legt eine zweite Kopie ab). Ohne Treffer
        # bricht das Skript mit einem Eingabefehler ab, statt 0 % durchzuwinken.
        run: |
          mapfile -d '' reports < <(find TestResults -name '*.cobertura.xml' -print0)
          python3 scripts/check-coverage.py "${reports[@]}" \
            --min-total 92 --min-file 50 \
            --exclusions scripts/coverage-exclusions.txt \
            --sources ProjektZeh \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-test-results
          # TestResults/golden enthaelt nur bei abweichenden Referenzbildern die erhaltenen Bilder.
          path: |
            TestResults/*.trx
            TestResults/**/*.cobertura.xml
            TestResults/golden/
          if-no-files-found: warn
          retention-days: 14

  # Laeuft immer, auch bei reinen Doku-PRs: dort ist das die einzige inhaltliche Pruefung.
  lint:
    name: Docs, scripts and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check relative Markdown links and anchors
        run: python3 scripts/check-doc-links.py

      # shellcheck ist auf dem Runner vorinstalliert. Fehler und Warnungen brechen ab, Hinweise (info/style) nicht.
      - name: Lint shell scripts
        run: git ls-files '*.sh' ':!:**/ThirdParty/**' | xargs shellcheck --severity=warning

      # Aktualisieren: neue Version und deren SHA-256 aus actionlint_<Version>_checksums.txt des Releases eintragen (Dependabot hebt
      # einen curl-Pin nicht).
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: '1.7.8'
          ACTIONLINT_SHA256: be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Die Hosttests laufen zusaetzlich unter Windows: Pfadtrenner, Zeilenenden und Groesse-/Kleinschreibung weichen dort ab
  # (mehrere Storage-Befunde betrafen genau das). Ohne Abdeckungsbericht; der Linux-Job bleibt die massgebliche Pruefung.
  tests-windows:
    name: Shell tests (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Run shell tests
        run: >-
          dotnet test ProjektZeh.Tests/ProjektZeh.Tests.csproj
          --configuration Release -warnaserror
          --logger "trx;LogFileName=shell-tests-windows.trx"
          --blame-hang-timeout 5m --blame-hang-dump-type none
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-test-results-windows
          path: |
            TestResults/*.trx
            TestResults/golden/
          if-no-files-found: warn
          retention-days: 14

  kernel:
    name: Cosmos x64 build
    needs: changes
    # Der Gastlauf haengt an diesem Job und entfaellt bei reinen Doku-PRs mit.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install matching Cosmos CLI and patcher
        run: |
          dotnet tool install --global Cosmos.Tools --version 3.0.97
          dotnet tool install --global Cosmos.Patcher --version 3.0.97

      - name: Install Cosmos native toolchain
        # Mit Token gilt das API-Limit pro Repository statt geteilt pro Runner-IP (sonst 403).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cosmos install --auto --tools

      - name: Check build tools
        run: cosmos check

      - name: Build the x64 kernel and ISO
        shell: bash
        run: |
          mkdir -p artifacts
          cosmos build --project ProjektZeh/ProjektZeh.csproj --arch x64 --config Release --verbose 2>&1 | tee artifacts/kernel-build.log

      - name: Upload bootable ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZehOS-x64
          path: ProjektZeh/output-x64/ProjektZeh.iso
          if-no-files-found: error
          retention-days: 14

      - name: Upload kernel build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-build-log
          path: artifacts/kernel-build.log
          if-no-files-found: warn
          retention-days: 14

  # Eigener Job statt Schritte im Kernel-Job: der Gastlauf haengt nur am ISO und soll nicht auf den vollstaendigen Neubau der
  # Release-Images (Live- und Installer-ISO, rund eine Minute) warten. Der Job baut die Toolchain selbst und laeuft parallel.
  release-images:
    name: Release images (live and installer)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install matching Cosmos CLI and patcher
        run: |
          dotnet tool install --global Cosmos.Tools --version 3.0.97
          dotnet tool install --global Cosmos.Patcher --version 3.0.97

      - name: Install Cosmos native toolchain
        # Mit Token gilt das API-Limit pro Repository statt geteilt pro Runner-IP (sonst 403).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cosmos install --auto --tools

      - name: Check build tools
        run: cosmos check

      - name: Build live and installer release images
        run: scripts/build-release.sh 0.0.0 "$RUNNER_TEMP/zehos-release-check"

      - name: Check release artifacts for local paths
        run: python3 scripts/check-release-paths.py "$RUNNER_TEMP"/zehos-release-check/*

  netsurf:
    name: NetSurf offline package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bison m4 libpng-dev zlib1g-dev

      - name: Build NetSurf WASIp1 package files
        run: python3 experiments/NetSurf.Wasi/build.py --jobs 4

      - name: Upload unsigned package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NetSurf-offline-files
          path: experiments/NetSurf.Wasi/bin/package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NetSurf-build-logs
          path: .tools/netsurf/logs/
          if-no-files-found: warn
          retention-days: 14

  rechner:
    name: Rechner package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test and build Rechner WASIp1 package files
        run: python3 experiments/Rechner.Wasi/build.py

      - name: Upload unsigned package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Rechner-files
          path: experiments/Rechner.Wasi/bin/package/
          if-no-files-found: error
          retention-days: 14

  guest:
    name: Guest boot and desktop (QEMU)
    runs-on: ubuntu-24.04
    needs: kernel
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download bootable ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ZehOS-x64
          path: iso

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils

      # Ohne KVM: der Lauf prueft den Weg Eingabe -> Treiber -> Bildpuffer unter TCG, nicht die Geschwindigkeit.
      - name: Boot the ISO and drive the desktop
        # Eigene Grenze unter der des Jobs, damit der Upload der Bilder auch nach einem haengenden Gast noch laeuft.
        timeout-minutes: 20
        run: python3 scripts/test-desktop-guest.py --iso iso/ProjektZeh.iso --accel tcg

      - name: Upload guest screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-desktop
          path: .tools/desktop-guest/
          # .tools ist ein versteckter Ordner; ohne diese Angabe laedt die Action nichts hoch.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  guest-recovery:
    name: Guest recovery boot (QEMU)
    # Das Recovery-ISO braucht einen eigenen Kernelbuild (rund 40 s). Der Job laeuft parallel zu den uebrigen und verlaengert
    # die Pipeline nicht; er entfaellt wie der Gastlauf bei reinen Doku-PRs.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install matching Cosmos CLI and patcher
        run: |
          dotnet tool install --global Cosmos.Tools --version 3.0.97
          dotnet tool install --global Cosmos.Patcher --version 3.0.97

      - name: Install Cosmos native toolchain
        # Mit Token gilt das API-Limit pro Repository statt geteilt pro Runner-IP (sonst 403).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cosmos install --auto --tools

      - name: Check build tools
        run: cosmos check

      - name: Build the recovery ISO
        run: dotnet build ProjektZeh/ProjektZeh.csproj --configuration Release -p:ZehOSRecovery=true

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils

      - name: Boot the recovery ISO to the text shell
        # Eigene Grenze unter der des Jobs, damit der Upload der Bilder auch nach einem haengenden Gast noch laeuft.
        timeout-minutes: 10
        run: >-
          python3 scripts/test-desktop-guest.py
          --iso ProjektZeh/bin/Release/net10.0/linux-x64/cosmos/ProjektZeh.iso
          --accel tcg --recovery

      - name: Upload guest screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-recovery
          path: .tools/desktop-guest/
          # .tools ist ein versteckter Ordner; ohne diese Angabe laedt die Action nichts hoch.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

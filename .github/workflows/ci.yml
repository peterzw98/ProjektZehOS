name: Bridge tests
on:
  push:
    branches: [disc-bridge]
  pull_request:
    branches: [disc-bridge]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Bridge self-test
        run: python3 test_bridge.py
      - name: Signatures and verification
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: sh -n verify.sh

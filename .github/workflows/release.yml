name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fuer den Abgleich Tag gegen abgeleitete Version (ZehOSVersionFromGit) braucht es die volle Historie.
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404' # = deploy/cosmos/SDK (Test in scripts/tests)
      - name: Restore built Cosmos packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deploy/cosmos/feed
          key: cosmos-feed-${{ runner.os }}-${{ hashFiles('deploy/cosmos/COMMIT', 'deploy/cosmos/VERSION', 'deploy/cosmos/SDK', 'scripts/build-cosmos.sh') }}

      - name: Build Cosmos from source and install tools
        # Baut den Branch cosmos (deploy/cosmos/COMMIT) in den Feed und installiert Cosmos.Tools und cosmos.patcher in derselben Version.
        run: scripts/build-cosmos.sh --global
      - name: Install Cosmos native toolchain
        # Wie in ci.yml: Mit Token gilt das API-Limit pro Repository statt geteilt pro Runner-IP (sonst 403).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cosmos install --auto --tools
      - name: Check build tools
        run: cosmos check
      - name: Run host tests
        run: |
          dotnet test ProjektZeh.Tests/ProjektZeh.Tests.csproj --configuration Release -warnaserror
          python3 -m unittest discover -s scripts/tests
      - name: Check tag against derived version
        # Der Tag muss die Version sein, die ProjektZeh.csproj fuer diesen Commit ableitet; sonst traegt das Release eine
        # andere Nummer als jeder Entwicklungsbau desselben Stands.
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          derived=$(dotnet msbuild ProjektZeh/ProjektZeh.csproj -nologo -t:GetAssemblyVersion -getProperty:Version)
          if [[ "v$derived" != "$RELEASE_REF" ]]; then
            echo "Tag $RELEASE_REF passt nicht zur abgeleiteten Version $derived dieses Commits." >&2
            exit 1
          fi
      - name: Build release
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version=${RELEASE_REF#v}
          scripts/build-release.sh "$version" "$RUNNER_TEMP/zehos-release"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Sign and verify update
        env:
          SIGNING_KEY: ${{ secrets.ZEHOS_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then echo 'ZEHOS_UPDATE_SIGNING_KEY fehlt.' >&2; exit 1; fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          python3 scripts/sign-update.py "$RUNNER_TEMP/zehos-release/update-manifest.txt" "$key"
          python3 scripts/sign-update.py verify "$RUNNER_TEMP/zehos-release/update-manifest.txt" "$RUNNER_TEMP/zehos-release/update-manifest.sig" 'eebr5IjF0GjyGoAUrBhwUDUx5STOMTsAhfrq2af5s+Y='
      - name: Check release artifacts for local paths
        run: python3 scripts/check-release-paths.py "$RUNNER_TEMP"/zehos-release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" --verify-tag --title "ZehOS $RELEASE_VERSION" \
            "$RUNNER_TEMP/zehos-release/ZehOS-$RELEASE_VERSION.iso" \
            "$RUNNER_TEMP/zehos-release/ZehOS-Setup-$RELEASE_VERSION.iso" \
            "$RUNNER_TEMP/zehos-release/ProjektZeh-$RELEASE_VERSION.elf" \
            "$RUNNER_TEMP/zehos-release/update-manifest.txt" \
            "$RUNNER_TEMP/zehos-release/update-manifest.sig"

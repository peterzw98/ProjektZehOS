<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Ladybird im ZehOS-Gast</title>
  <desc id="description">Ladybirds Hub und vier Typen von Hilfsprozessen laufen in Ring 3 und kommunizieren über Unix-Sockets. Systemaufrufe gehen an die Linux-ABI-Schicht des ZehOS-Kernels auf Cosmos Gen3 in Ring 0.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#74dfbc"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#0b1723"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="69" fill="#79dfbc" font-size="22" font-weight="700" letter-spacing="2">ZEHOS · ARCHITEKTUR</text>
    <text x="64" y="139" fill="#f3f9fc" font-size="59" font-weight="700">Ladybird im ZehOS-Gast</text>

    <rect x="64" y="184" width="1472" height="354" rx="20" fill="#142938" stroke="#36566a" stroke-width="2"/>
    <text x="95" y="229" fill="#91e6cb" font-size="24" font-weight="700">Ring 3 · Linux-ELF mit musl</text>
    <text x="1504" y="229" text-anchor="end" fill="#b8d1de" font-size="22">Headless · CPU-Zeichnen</text>
    <rect x="586" y="253" width="428" height="78" rx="13" fill="#21505b" stroke="#65ccb0" stroke-width="2"/>
    <text x="800" y="285" text-anchor="middle" fill="#f3fcfb" font-size="27" font-weight="700">Hub</text>
    <text x="800" y="314" text-anchor="middle" fill="#bce7e4" font-size="20">Einstiegspunkt für den Headless-Start</text>

    <path d="M800 331V371M254 371H1346M254 371V405M618 371V405M982 371V405M1346 371V405" fill="none" stroke="#73d8bd" stroke-width="3"/>
    <circle cx="800" cy="371" r="5" fill="#8df0ce"/>
    <text x="1504" y="355" text-anchor="end" fill="#a5ead7" font-size="21">IPC über Unix-Sockets</text>

    <g fill="#1a3446" stroke="#426579" stroke-width="2">
      <rect x="96" y="405" width="316" height="98" rx="12"/>
      <rect x="460" y="405" width="316" height="98" rx="12"/>
      <rect x="824" y="405" width="316" height="98" rx="12"/>
      <rect x="1188" y="405" width="316" height="98" rx="12"/>
    </g>
    <g fill="#f0f8fa" font-size="27" font-weight="700" text-anchor="middle">
      <text x="254" y="447">WebContent</text>
      <text x="618" y="447">RequestServer</text>
      <text x="982" y="447">Compositor</text>
      <text x="1346" y="447">ImageDecoder</text>
    </g>
    <g fill="#bbd4de" font-size="21" text-anchor="middle">
      <text x="254" y="478">Seiteninhalt und Rendering</text>
      <text x="618" y="478">Netzwerk und TLS</text>
      <text x="982" y="478">Bildzusammensetzung</text>
      <text x="1346" y="478">Bilddekodierung bei Bedarf</text>
    </g>

    <path d="M800 540V611" stroke="#74dfbc" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="819" y="582" fill="#b7e7dc" font-size="20">Linux-Systemaufrufe</text>
    <rect x="64" y="617" width="1472" height="190" rx="20" fill="#172d3d" stroke="#42677a" stroke-width="2"/>
    <text x="96" y="662" fill="#91e6cb" font-size="24" font-weight="700">Ring 0 · ZehOS</text>
    <line x1="800" y1="685" x2="800" y2="773" stroke="#45677b" stroke-width="2"/>
    <text x="96" y="724" fill="#f2f9fb" font-size="33" font-weight="700">Linux-ABI-Schicht</text>
    <text x="96" y="762" fill="#bed4de" font-size="23">ELF-Lader, Prozesse, Dateien und Sockets</text>
    <text x="848" y="724" fill="#f2f9fb" font-size="33" font-weight="700">Cosmos Gen3</text>
    <text x="848" y="762" fill="#bed4de" font-size="23">C#-Kernel auf x86-64</text>

    <text x="64" y="863" fill="#a0b9c8" font-size="18">Quellen · LADYBIRD_FEASIBILITY (Prozessmodell, Ring 3, Stand D) · V31 strace-Abgleich (Unix-Sockets)</text>
  </g>
</svg>

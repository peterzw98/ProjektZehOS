# Vorlage fuer den Host-nginx (/etc/nginx/sites-available/packages.conf). certbot --nginx ergaenzt TLS.
# ZehOS braucht unkomprimierte Antworten mit Content-Length und keine Umleitungen auf HTTPS-Ebene.
server {
    listen 80;
    server_name packages.pjoter.de;

    gzip off;
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# Statisches ZehOS-Paketrepository hinter einem TLS-Reverse-Proxy (host-nginx.conf). ZehOS verlangt Status 200,
# Content-Length, keine Kompression, keine Transfercodierung (chunked) und keine Umleitungen. Echtheit sichern die
# Ed25519-Signaturen der Pakete, nicht der Server.
worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip off;
    autoindex off;
    # Grosse Dateien (WAD) bei langsamen Gaesten unter Emulation nicht abbrechen.
    send_timeout 120s;

    server {
        listen 8080;
        # Symlink auf den zuletzt vollstaendig ausgepackten Stand (updater.sh).
        root /srv/zehos-packages/current;

        # .git des Updaters und andere versteckte Dateien nicht ausliefern.
        location ~ /\. {
            return 404;
        }
        location / {
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri =404;
        }
    }
}

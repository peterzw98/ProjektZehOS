# Testdaten fuer PackageCatalog2Tests und scripts/tests/test_package2.py; Inhalte sind Platzhalter.
id = "libcxx"
version = "17.0.6"
release = 2
runtime = "linux-x64-v1"
license = "Apache-2.0 WITH LLVM-exception"

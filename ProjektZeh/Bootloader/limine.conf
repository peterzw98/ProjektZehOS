# Boot ProjektZeh with the Limine protocol. Full HD is the default; the second entry
# is the safe fallback for displays or drivers without 1920x1080.
timeout: 3

/ProjektZeh (1920x1080)
    protocol: limine
    resolution: 1920x1080x32
    path: boot():/boot/ProjektZeh.elf

/ProjektZeh (1024x768)
    protocol: limine
    resolution: 1024x768x32
    path: boot():/boot/ProjektZeh.elf
